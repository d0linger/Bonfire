name: Extended acceptance
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "38 4 * * 3"
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: go test -race -count=5 ./...
      - name: Fuzz denominations, posting dates and online request decoding
        run: |
          for target in FuzzCashPieces FuzzPostingDate FuzzOnlineRequest; do
            go test -run='^$' -fuzz="^$target$" -fuzztime=45s
          done
      - run: git worktree add --detach "$RUNNER_TEMP/bonfire-schema21" c6ab58bc5851f1500ab0be667bb0418842d237f0
      - shell: pwsh
        run: |
          ./ops/init.ps1
          ./ops/test-backup-upgrade.ps1 -PreviousSource (Join-Path $env:RUNNER_TEMP 'bonfire-schema21')
          ./ops/accept-s3.ps1
      - name: Scheduled online acceptance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./ops/accept-online.ps1
