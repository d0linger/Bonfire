name: Source analysis
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "12 5 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
          queries: security-extended
      - if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
      - name: Require a clean code scanning report
        run: |
          jq -se 'length > 0 and all(.[]; (.runs | length) > 0 and all(.runs[]; (.results | type == "array" and length == 0)))' "$RUNNER_TEMP"/codeql-results/*.sarif
  gosec:
    name: gosec and SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - run: gosec -fmt=sarif -out=gosec.sarif ./...
      - if: ${{ !cancelled() && hashFiles('gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gosec.sarif
          category: gosec
  deadcode:
    name: Unreachable Go functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: |
          go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./... > "$RUNNER_TEMP/deadcode.txt"
          cat "$RUNNER_TEMP/deadcode.txt"
          test ! -s "$RUNNER_TEMP/deadcode.txt"
  workflows:
    name: GitHub Actions lint and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      # actionlint 1.7.12 predates GitHub's repository-root reference syntax.
      # Lint the equivalent local references, including workflow inputs and permissions.
      - name: Lint all workflows
        run: |
          temp=$(mktemp -d)
          git clone --quiet --local . "$temp/repo"
          cd "$temp/repo"
          sed -i 's|uses: \$/\.github/workflows/|uses: ./.github/workflows/|' .github/workflows/test.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Audit workflow permissions and trust boundaries
        run: |
          mkdir "$RUNNER_TEMP/zizmor"
          cd "$RUNNER_TEMP/zizmor"
          curl --fail --silent --show-error --location -o release.tgz https://github.com/zizmorcore/zizmor/releases/download/v1.33.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43  release.tgz" | sha256sum --check
          tar -xzf release.tgz
          scanner=$(find "$PWD" -type f -name zizmor -print -quit)
          cd "$GITHUB_WORKSPACE"
          "$scanner" --offline .
