name: Container inspection
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [app, backup-worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build local image
        run: docker build --target "${{ matrix.target }}" -t "bonfire:$GITHUB_SHA" .
      - name: Verify scanner and inspect image
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/trivy.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --format cyclonedx --output sbom.json "bonfire:$GITHUB_SHA"
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "bonfire:$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.target }}-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
