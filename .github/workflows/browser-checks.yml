name: Browser checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Accessibility and CSP (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      BONFIRE_ENGINE: ${{ matrix.engine }}
      BONFIRE_PORT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "$BONFIRE_ENGINE"
      - shell: pwsh
        run: ./ops/init.ps1
      - name: Start disposable browser installation
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "BONFIRE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          BONFIRE_ADMIN_PASSWORD="$password" docker compose up -d --build --wait
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" -keyout "$RUNNER_TEMP/browser.key" -out "$RUNNER_TEMP/browser.crt"
      - run: |
          address=$(docker compose port app 8080)
          export BONFIRE_URL="http://$address"
          node tests/browser-guards.mjs
      - if: always()
        run: docker compose down --volumes
