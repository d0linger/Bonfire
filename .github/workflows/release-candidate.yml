name: Attested release images
on:
  workflow_dispatch:
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [app, backup-worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and check the artifact that will be released
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          image="bonfire-$TARGET:$GITHUB_SHA"
          docker build --target "$TARGET" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/trivy.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image"
          "$RUNNER_TEMP/trivy" image --format cyclonedx --output sbom.json "$image"
          docker save --output image.tar "$image"
      - name: Sign build provenance for the exact tar file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: image.tar
      - name: Attest the image inventory against the same file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: image.tar
          sbom-path: sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bonfire-${{ matrix.target }}-${{ github.sha }}
          path: |
            image.tar
            sbom.json
          if-no-files-found: error
