name: Prüfung
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: bonfire-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Online acceptance
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: make lint
      - run: make test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - shell: pwsh
        run: |
          ./ops/init.ps1
          ./ops/accept-online.ps1
  container:
    uses: ./.github/workflows/container.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
  gate:
    name: BONFIRE required checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [test, security, container]
    env:
      ONLINE: ${{ needs.test.result }}
      CONTAINER: ${{ needs.container.result }}
      SECURITY: ${{ needs.security.result }}
    steps:
      - run: test "$ONLINE" = success && test "$SECURITY" = success && test "$CONTAINER" = success
