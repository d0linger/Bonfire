name: Prüfung
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: go test ./... && go vet ./...
      - run: npm ci && npm test && npm run build
      - shell: bash
        run: |
          printf 'BONFIRE_ADMIN_PASSWORD=%s\nBONFIRE_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .env
          printf 'BONFIRE_RUNTIME_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
          npx playwright install --with-deps chromium
          pwsh ./ops/accept-online.ps1
          export BONFIRE_OFFLINE_ENABLED=true
          docker compose up -d --build --wait
          node tests/api.mjs
          node tests/accounts.mjs
          node tests/import.mjs
          node tests/security.mjs
          node tests/incidents.mjs
          node tests/donation-reports.mjs
          node tests/wallet-settlement.mjs
          node tests/prices.mjs
          node tests/conflict-originals.mjs
          node tests/lifecycle.mjs
          node tests/account-mode.mjs
          node tests/carry-forward.mjs
          node tests/attachments.mjs
          node tests/layout-limits.mjs
          BONFIRE_URL=http://127.0.0.1:8137 node tests/workplace.mjs
          BONFIRE_URL=http://127.0.0.1:8137 node tests/login.mjs
          node tests/offline.mjs
          node tests/documents.mjs
          node tests/storage.mjs
          node tests/word-layout.mjs
      - name: Verschlüsselte Wiederherstellung prüfen
        shell: pwsh
        run: |
          $env:BONFIRE_OFFLINE_ENABLED = 'true'
          $key = Join-Path $env:RUNNER_TEMP 'bonfire-ci.key'
          node ops/crypt.mjs keygen $key
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = & ./ops/rotate-backup.ps1 -Directory test-results -KeyFile $key
          & ./ops/verify-restore.ps1 -Path $archive -KeyFile $key -VerifyExercise
