version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    target-branch: dev
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
  - package-ecosystem: docker-compose
    directory: "/"
    target-branch: dev
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
