version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    target-branch: dev
    schedule: &schedule
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule: *schedule
  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule: *schedule
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule: *schedule
