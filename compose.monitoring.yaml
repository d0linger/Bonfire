services:
  app:
    environment:
      BONFIRE_METRICS_ADDRESS: ":9091"
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    ports:
      - "127.0.0.1:9137:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics:/prometheus
volumes:
  metrics:
