services:
  s3test:
    image: rclone/rclone:1.69.1
    entrypoint: ["/bin/sh","-ec"]
    command: ["mkdir -p /data/review-archive && exec rclone serve s3 /data --addr :9000 --auth-key review-only,isolated-fixture-only"]
  backup:
    environment:
      BONFIRE_S3_ENDPOINT: s3test:9000
      BONFIRE_S3_BUCKET: review-archive
      BONFIRE_S3_PREFIX: fiscal-test
      BONFIRE_S3_ACCESS_KEY: review-only
      BONFIRE_S3_SECRET_KEY: isolated-fixture-only
      BONFIRE_S3_REGION: us-east-1
      BONFIRE_S3_USE_HTTP: "true"
  app:
    ports: !override
      - "127.0.0.1::8080"
