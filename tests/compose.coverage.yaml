services:
  migrate:
    build:
      args:
        BONFIRE_COVER: "true"
    environment:
      GOCOVERDIR: /coverage
    volumes:
      - ${BONFIRE_COVERAGE_DIR:-./test-results/integration-counters}:/coverage
  app:
    environment:
      GOCOVERDIR: /coverage
    volumes:
      - ${BONFIRE_COVERAGE_DIR:-./test-results/integration-counters}:/coverage
  backup:
    build:
      args:
        BONFIRE_COVER: "true"
    environment:
      GOCOVERDIR: /coverage
    volumes:
      - ${BONFIRE_COVERAGE_DIR:-./test-results/integration-counters}:/coverage
