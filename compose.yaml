services:
  db:
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_DB: bonfire
      POSTGRES_USER: bonfire
      POSTGRES_PASSWORD: ${BONFIRE_DB_PASSWORD:?Lokales Datenbankpasswort setzen}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bonfire", "-d", "bonfire"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: "${COMPOSE_PROJECT_NAME:-bonfire-app}:local"
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://bonfire@db/bonfire?sslmode=disable
      PGPASSWORD: ${BONFIRE_DB_PASSWORD}
      BONFIRE_ADMIN_PASSWORD: ${BONFIRE_ADMIN_PASSWORD:?Lokales Startpasswort setzen}
      BONFIRE_RUNTIME_PASSWORD: ${BONFIRE_RUNTIME_PASSWORD:?Separates Runtime-Kennwort setzen}
      BONFIRE_TOTP_KEY_FILE: /run/bonfire-totp/key
    volumes:
      - totp-key:/run/bonfire-totp
    depends_on:
      db:
        condition: service_healthy
  app:
    image: "${COMPOSE_PROJECT_NAME:-bonfire-app}:local"
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BONFIRE_BACKUP_SOCKET: /run/bonfire-backup/worker.sock
      BONFIRE_BACKUP_UPLOAD_MAX_BYTES: ${BONFIRE_BACKUP_UPLOAD_MAX_BYTES:-536870912}
      BONFIRE_PASSKEY_ORIGIN: ${BONFIRE_PASSKEY_ORIGIN:-http://localhost:${BONFIRE_PORT:-8137}}
      BONFIRE_TOTP_KEY_FILE: /run/bonfire-totp/key
      DATABASE_URL: postgres://bonfire_runtime@db/bonfire?sslmode=disable&pool_max_conns=8&statement_timeout=30000&lock_timeout=8000
      PGPASSWORD: ${BONFIRE_RUNTIME_PASSWORD}
    ports:
      - "127.0.0.1:${BONFIRE_PORT:-8137}:8080"
    volumes:
      - backup-ipc:/run/bonfire-backup:ro
      - totp-key:/run/bonfire-totp:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
  backup:
    build:
      context: .
      target: backup-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://bonfire@db/bonfire?sslmode=disable
      BONFIRE_BACKUP_UPLOAD_MAX_BYTES: ${BONFIRE_BACKUP_UPLOAD_MAX_BYTES:-536870912}
      PGPASSWORD: ${BONFIRE_DB_PASSWORD}
      BONFIRE_RUNTIME_PASSWORD: ${BONFIRE_RUNTIME_PASSWORD}
      BONFIRE_S3_ENDPOINT: ${BONFIRE_S3_ENDPOINT:-}
      BONFIRE_S3_BUCKET: ${BONFIRE_S3_BUCKET:-}
      BONFIRE_S3_PREFIX: ${BONFIRE_S3_PREFIX:-bonfire}
      BONFIRE_S3_REGION: ${BONFIRE_S3_REGION:-}
      BONFIRE_S3_ACCESS_KEY: ${BONFIRE_S3_ACCESS_KEY:-}
      BONFIRE_S3_SECRET_KEY: ${BONFIRE_S3_SECRET_KEY:-}
      BONFIRE_S3_USE_HTTP: ${BONFIRE_S3_USE_HTTP:-false}
      TZ: ${BONFIRE_TZ:-Europe/Vienna}
    volumes:
      - backups:/var/lib/bonfire-backup
      - backup-key:/var/lib/bonfire-key
      - backup-ipc:/run/bonfire-backup
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  data:
  backups:
  backup-key:
  backup-ipc:
  totp-key:
