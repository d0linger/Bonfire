<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#20242b" />
    <script src="/theme.js"></script>
    <title>BONFIRE · Feuerwehrfinanzen</title>
    <link rel="icon" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="auth-screen">
    <a class="skip" href="#content">Zum Inhalt</a>
    <aside id="sidebar">
      <header>
        <img src="/logo-original.svg" alt="" />
        <div><strong>BONFIRE</strong><small>Feuerwehrfinanzen</small></div>
      </header>
      <div class="stripe" aria-hidden="true"></div>
      <div id="sidebar-year"></div>
      <nav aria-label="Arbeitsbereiche"></nav>
    </aside>
    <main>
      <div class="topbar">
        <button
          id="menu-toggle"
          type="button"
          aria-label="Navigation öffnen oder schließen"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          Menü</button
        ><span id="station" class="station"></span><span id="crumb"></span
        ><span id="connection"></span>
        <label class="theme-choice"
          ><span>Darstellung</span>
          <select id="theme-mode" aria-label="Darstellung">
            <option value="system">System</option>
            <option value="light">Hell</option>
            <option value="dark">Dunkel</option>
          </select>
        </label>
      </div>
      <div class="work-area">
        <div class="workspace-line">
          <div id="workspace-picker"></div>
          <div id="state" role="status"></div>
        </div>
        <div id="notice" role="alert"></div>
        <article id="content" tabindex="-1"></article>
      </div>
    </main>
    <dialog
      id="entry-dialog"
      class="record-editor entry-modal"
      aria-labelledby="entry-title"
    ></dialog>
  </body>
</html>
